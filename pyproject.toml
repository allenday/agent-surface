[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-surface"
version = "0.1.0"
description = "Project typed Python operations as agent-friendly CLIs, MCP tools, and schemas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Allen Day" }]
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.11,<3",
  "ruamel.yaml>=0.18,<0.19",
]

[project.urls]
Repository = "https://github.com/allenday/agent-surface"
Issues = "https://github.com/allenday/agent-surface/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_surface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_surface"]
mypy_path = "src"

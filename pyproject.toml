[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-surface"
version = "0.1.11"
description = "Project typed Python operations as agent-friendly CLIs, MCP tools, and schemas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Allen Day" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.11,<3",
  "ruamel.yaml>=0.19.1,<0.20",
]

[project.urls]
Repository = "https://github.com/allenday/agent-surface"
Issues = "https://github.com/allenday/agent-surface/issues"

[project.entry-points.hatch]
agent-surface = "agent_surface.hatch"

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[dependency-groups]
dev = [
  "hatchling>=1.32.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build]
exclude = ["/.superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_surface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_surface"]
mypy_path = "src"
